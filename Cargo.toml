[package]
name = "trill"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0 "

[workspace]
members = ["crates/*", "demo"]

[workspace.dependencies]
bevy_mod_props = { version = "0.1.0", path = "crates/bevy_mod_props", default-features = false }
trill_core = { version = "0.1.0", path = "crates/trill_core" }
trill_script = { version = "0.1.0", path = "crates/trill_script" }
bevy_trill = { version = "0.1.0", path = "crates/bevy_trill" }

bevy_app = "0.18.0"
bevy_asset = "0.18.0"
bevy_ecs = { version = "0.18.0", default-features = false }
bevy_reflect = "0.18.0"
bevy_tasks = "0.18.0"

# default features are only used in examples and demo
bevy = "0.18.0"

codespan-reporting = "0.13.1"
itertools = "0.14.0"
logos = "0.16"
# keeping this on 0.9 until Bevy updates it
rand = "0.9.2"
rapidhash = "4.1.1"
thiserror = "2.0.17"
ustr = "1.1.0"

[dependencies]
trill_core = { path = "crates/trill_core" }
trill_script = { path = "crates/trill_script" }
